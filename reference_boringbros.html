{"id": "gm", "s": "Startups", "t": "Gross margin", "b": "Lean Analytics", "d": "Gross margin is revenue minus the direct cost of delivering the product, as a share of revenue. Software aims high because each extra customer costs little to serve.", "e": "Revenue $100, direct costs $30: gross margin is 70%.", "q": "Revenue is $200 and direct costs are $50. Gross margin?", "o": ["25%", "50%", "75%", "150%"], "k": 2, "x": "(200 - 50) / 200 = 75%."},
{"id": "val", "s": "Startups", "t": "Pre-money and post-money valuation", "b": "Venture Deals", "d": "Pre-money is what the company is worth before new investment. Post-money is pre-money plus the money invested. An investor owns their investment divided by post-money.", "e": "$8M pre-money plus $2M invested is $10M post-money, so the investor owns 20%.", "q": "Pre-money is $4M and an investor puts in $1M. What does the investor own?", "o": ["10%", "20%", "25%", "33%"], "k": 1, "x": "Post-money is $5M, and $1M / $5M = 20%."},
{"id": "vm", "s": "Startups", "t": "How startups are valued", "b": "Venture Deals", "d": "Early on there is no single formula. Common approaches: revenue multiples (ARR times a multiple based on growth and market), comparable deals, and the VC method (expected exit value divided by the return investors want). The final price is negotiated.", "e": "$2M ARR at a 10x multiple suggests a $20M valuation.", "q": "ARR is $3M and similar startups sell at 8x ARR. Implied valuation?", "o": ["$11M", "$24M", "$38M", "$3M"], "k": 1, "x": "$3M x 8 = $24M."},
{"id": "dil", "s": "Startups", "t": "Dilution and the cap table", "b": "Venture Deals", "d": "The cap table lists who owns what. When new shares are issued, existing owners keep their shares but hold a smaller percentage. That is dilution, and it is normal if the company grows.", "e": "You own 50%. A new investor takes 20% of the company, so you own 40%.", "q": "You own 60%. New investors take 25% through new shares. Your stake now?", "o": ["35%", "45%", "55%", "60%"], "k": 1, "x": "60% x 0.75 = 45%."},
{"id": "safe", "s": "Startups", "t": "SAFE", "b": "Venture Deals", "d": "A SAFE (Simple Agreement for Future Equity) lets an investor give cash now and get shares later, at the next priced round. It usually has a valuation cap or a discount that rewards early backers.", "e": "A SAFE with a $5M cap converts as if the company were worth at most $5M, even if the next round values it higher.", "q": "What does the valuation cap on a SAFE do?", "o": ["Limits how much the company can raise", "Sets the maximum valuation used when it converts", "Fixes the founder salary", "Sets the exit price"], "k": 1, "x": "It caps the price per share the investor pays when converting."},
{"id": "term", "s": "Startups", "t": "Term sheet", "b": "Venture Deals", "d": "A term sheet outlines the main terms of an investment: valuation, amount, board seats and investor rights. It is mostly non-binding, but it sets the deal lawyers then write up.", "e": "Valuation, liquidation preference and board seats are agreed here before final documents.", "q": "What is true of a typical term sheet?", "o": ["It is a fully binding contract", "It outlines key terms and is mostly non-binding", "It only lists the founders", "It replaces the cap table"], "k": 1, "x": "It sets the outline. Most terms are non-binding until final documents are signed."},
{"id": "lp", "s": "Startups", "t": "Liquidation preference", "b": "Venture Deals", "d": "It decides who gets paid first when the company is sold. A 1x preference lets investors take their money back before common shareholders see anything. It matters most in a low-priced sale.", "e": "Investors put in $2M with a 1x preference. The company sells for $1.5M, and investors take all $1.5M.", "q": "Investors put in $3M with a 1x preference. The company sells for $2M. Who is paid first?", "o": ["Founders", "Investors, up to the $2M available", "Employees equally", "Nobody"], "k": 1, "x": "Preferred investors are paid before common holders."},
{"id": "mvp", "s": "Startups", "t": "MVP", "b": "The Lean Startup", "d": "A Minimum Viable Product is the smallest version of a product that lets you learn whether customers want it. It tests an idea, not impresses. Learning beats polish.", "e": "Before building an app, a founder sells the service by hand to ten customers.", "q": "What is the main purpose of an MVP?", "o": ["To launch a perfect product", "To learn what customers want with minimal effort", "To impress investors with design", "To cut costs permanently"], "k": 1, "x": "An MVP exists to test assumptions quickly."},
{"id": "pmf", "s": "Startups", "t": "Product-market fit", "b": "The Lean Startup", "d": "Product-market fit means the product meets real demand: customers keep using it and tell others. Signs are strong retention, organic referrals, and users who would be upset if it vanished.", "e": "A survey where many users say they would be very disappointed without the product is a common test.", "q": "Which is the strongest sign of product-market fit?", "o": ["A big launch day", "Customers keep using it and refer others", "A beautiful website", "Many press mentions"], "k": 1, "x": "Retention and organic demand show real pull, not just attention."},
{id:'loss',s:'Mind',t:'Loss aversion',b:'Thinking, Fast and Slow',d:'Losing something hurts more than gaining the same thing feels good. Studies are often summed up as losses weighing roughly twice as much as equal gains. It quietly steers choices: holding a bad investment, refusing a fair trade, staying in a plan because quitting feels like a loss.',e:'You get a free mug and love it. Offered a fair price, you want more to sell it than you would have paid to buy it.',q:'Why do people hold a losing stock too long?',o:['They believe in the company','Selling makes the loss feel real','They forgot they own it','Brokers advise against selling'],k:1,x:'Selling turns a paper loss into a real one, and loss aversion makes that feel worse than the same money never gained.'},
{id:'deep',s:'Work',t:'Deep work',b:'Deep Work',d:'Deep work is focused effort without distraction that stretches your abilities. It produces better results in less time than scattered attention, and it is rare enough to be valuable. Protect blocks of time for it.',e:'Phone in another room, notifications off, one 90-minute block on a single hard task.',q:'Which of these is deep work?',o:['Checking email in short bursts','Two hours writing with notifications off','Attending a status meeting','Scrolling while a task is open'],k:1,x:'Deep work needs sustained, undistracted focus on one demanding task.'},
{id:'loop',s:'Habits',t:'The habit loop',b:'The Power of Habit',d:'A habit runs in three parts: a cue, a routine and a reward. The cue starts the routine and the reward teaches your brain to repeat it. To change a habit, keep the cue and reward, and swap the routine.',e:'Stress at 3pm (cue), a biscuit (routine), a break (reward). Swap in a short walk and you keep the break.',q:'In the habit loop, what triggers the routine?',o:['The reward','The cue','Willpower','The craving for change'],k:1,x:'The cue is the trigger. The routine follows it, and the reward reinforces it.'},
{id:'two',s:'Habits',t:'Two-minute rule',b:'Atomic Habits',d:'Make a new habit start in under two minutes. The point is to show up, not to finish. Once you start, continuing is far easier than beginning.',e:'Read 30 pages becomes read one page. Run three miles becomes put on your running shoes.',q:'What is the best two-minute version of "write a book"?',o:['Write a chapter','Write one sentence','Plan the whole outline','Quit social media'],k:1,x:'It should be tiny enough to start right now. One sentence gets you moving.'},
{id:'inv',s:'Strategy',t:'Inversion',b:"Poor Charlie's Almanack",d:'Solve problems backwards. Instead of asking how to succeed, ask what would guarantee failure, then avoid exactly that. It exposes risks that forward thinking misses.',e:'Instead of how to build a great team, list what would wreck a team and rule those out.',q:'Which question is an inversion of "How do I get fit?"',o:['What exercise is best?','What would make me unfit, and how do I avoid it?','How fast can I get fit?','Who should I train with?'],k:1,x:'Inversion flips the goal into its opposite and works backwards from it.'},
{id:'mos',s:'Money',t:'Margin of safety',b:'The Intelligent Investor',d:'Pay well below what you think something is worth, so errors in your estimate do not hurt you. The bigger the gap, the more room for being wrong.',e:'If you value a business at 100, buying at 60 protects you far more than buying at 95.',q:'You estimate a stock is worth 100. Which price gives the largest margin of safety?',o:['110','100','90','60'],k:3,x:'The lower the price against your estimated value, the larger the cushion.'},
{id:'sec',s:'Strategy',t:'Second-order thinking',b:'The Great Mental Models',d:'First-order thinking looks at the direct result. Second-order thinking asks: and then what? It follows consequences of consequences, which is where most surprises live.',e:'Cutting prices brings customers today. Then rivals cut too, and everyone earns less.',q:'A shop cuts prices. Which is a second-order effect?',o:['More customers walk in','Sales rise that day','Competitors cut prices in response','The sign is repainted'],k:2,x:'It is a consequence of the first effect, not the first effect itself.'},
{id:'par',s:'Work',t:'Pareto principle',b:'The 80/20 Principle',d:'A small share of causes often drives most of the results. The exact numbers vary, but the imbalance is common. Find the vital few and give them your best attention.',e:'A handful of customers bring most of the revenue, and a few tasks create most of the progress.',q:'About 20% of your customers bring 80% of revenue. What fits the principle?',o:['Treat all customers identically','Protect and serve that 20% first','Drop the other 80%','Ignore revenue data'],k:1,x:'Focus goes where the impact is concentrated, without throwing the rest away.'},
{id:'eis',s:'Work',t:'Eisenhower matrix',b:'The 7 Habits of Highly Effective People',d:'Sort tasks by urgent and important. Urgent and important: do now. Important but not urgent: schedule. Urgent but not important: delegate. Neither: drop. Most progress lives in important but not urgent.',e:'Planning next quarter is important but not urgent, so it gets a slot on the calendar.',q:'A task is important but not urgent. What do you do?',o:['Do it immediately','Schedule it','Delegate it','Delete it'],k:1,x:'Important but not urgent work is protected by scheduling it before it becomes urgent.'}
];

Work:()=>{const f=Math.floor(r()*20);for(let i=0;i<20;i++)o+=`<rect x="${50+(i%5)*64}" y="${40+Math.floor(i/5)*60}" width="48" height="48" rx="8" fill="${i==f?s:'none'}" stroke="${s}" stroke-width="2.5"/>`},
Strategy:()=>{let x=40,y=250,d=`M${x} ${y}`,n='';for(let i=0;i<5;i++){x+=55+r()*20;y=Math.max(40,Math.min(260,y-(r()*70-25)));d+=` L${L(x)} ${L(y)}`;n+=`<circle cx="${L(x)}" cy="${L(y)}" r="9" fill="${s}"/>`}o=`<path d="${d}" fill="none" stroke="${s}" stroke-width="3" stroke-dasharray="6 8"/>`+n}};
(T[c.s]||T.Mind)();return `<div class="art"><svg viewBox="0 0 400 300" aria-hidden="true">${o}</svg></div>`}
function burst(id){const s=document.getElementById('k-'+id),b=document.createElement('div');b.className='burst';b.innerHTML=Array.from({length:16},(_,i)=>{const a=i/16*6.283,d=90+Math.random()*80;return `<span style="--x:${Math.round(Math.cos(a)*d)}px;--y:${Math.round(Math.sin(a)*d)}px"></span>`}).join('');s.appendChild(b);setTimeout(()=>b.remove(),900)}
function ring(){const n=Object.keys(S.done).length,f=n/D.length,C=87.96;return `<svg width="36" height="36" viewBox="0 0 36 36" role="img" aria-label="${n} of ${D.length} mastered"><circle cx="18" cy="18" r="14" fill="none" stroke="var(--ln)" stroke-width="4"/><circle cx="18" cy="18" r="14" fill="none" stroke="var(--ink)" stroke-width="4" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${(C*(1-f)).toFixed(1)}" transform="rotate(-90 18 18)"/><text x="18" y="22" text-anchor="middle" font-size="11" font-family="IBM Plex Mono,monospace" fill="currentColor">${n}</text></svg>`}
const WEL=n=>`<section class="cd" style="background:#FCAC04;color:#0B0B0C"><div class="top"><span class="m chip">by BoringBroLabs</span><span class="m">${n} ideas</span></div><div class="bd" style="flex:1;margin-top:0;justify-content:center"><img class="mk" style="width:92px;height:92px;border-radius:22px;margin-bottom:24px" src="${LOGO}" alt="BoringBroLabs logo"><h2 class="ti">Scroll less.<br>Learn more.</h2><p class="hk">Facts that feel wrong, ideas from top books, and the terms founders use. One minute each, with a question on every one.</p><button class="go" style="background:#0B0B0C;color:#FCAC04" onclick="document.getElementById('feed').scrollBy({top:document.getElementById('feed').clientHeight,behavior:'smooth'})">Start reading</button><div class="m hint">or swipe up<i></i></div></div></section>`;
function body(c){const s=st[c.id]||0,fg=CL[c.s][1],bg=CL[c.s][0],btn=`background:${fg};color:${bg}`;
 if(s==0)return `<div class="m" style="margin-bottom:14px">from ${c.b}</div><h2 class="ti${c.t.length>20?' m2':''}">${c.t}</h2><p class="hk">${c.d.indexOf('. ')>0?c.d.slice(0,c.d.indexOf('. ')+1):c.d}</p><button class="go" style="${btn}" onclick="step('${c.id}')">Tap to learn</button>`;
 if(s==1)return `<h2 class="ti s">${c.t}</h2><p class="tx">${c.d}</p><div class="ex"><span class="m">Example</span><br>${c.e}</div><button class="go" style="${btn}" onclick="step('${c.id}')">Quiz me</button>`;
 const p=pk[c.id],ans=p!=null;
 return `<div class="m" style="margin-bottom:12px">Your turn</div><h2 class="ti s" style="font-size:clamp(26px,8vw,34px);line-height:1.08;letter-spacing:-.03em">${c.q}</h2>${c.o.map((o,i)=>`<button class="op ${ans?(i==c.k?'ok':i==p?'no':''):''}" style="${ans&&i==c.k?btn:''}" ${ans?'disabled':''} onclick="pick('${c.id}',${i})">${'ABCD'[i]}. ${o}</button>`).join('')}${ans?`${p==c.k?'<span class="stamp m">Mastered</span>':''}<p class="fb"><b>${p==c.k?'Correct. ':'Not quite. '}</b>${c.x}</p><button class="go" style="${btn};margin-top:8px" onclick="nxt('${c.id}')">Next</button>`:''}`}
function sec(c,i,n){const[bg,fg]=CL[c.s];return `<section class="cd" id="k-${c.id}" data-s="0" style="background:${bg};color:${fg}">${art(c)}<div class="top"><span class="m chip">${c.s}${S.done[c.id]?' Â· mastered':''}</span><span class="m">${pad(i+1)} / ${n}</span></div><div class="bd" id="b-${c.id}" style="background:${bg}">${body(c)}</div></section>`}
function paint(id){const c=D.find(x=>x.id==id),b=document.getElementById('b-'+id);b.style.animation='none';b.offsetHeight;b.style.animation='';b.innerHTML=body(c);document.getElementById('k-'+id).dataset.s=st[id]||0}
function step(id){st[id]=(st[id]||0)+1;paint(id)}
function pick(id,i){const c=D.find(x=>x.id==id);if(pk[id]!=null)return;pk[id]=i;S.ans++;if(i==c.k){S.ok++;S.done[id]=1;burst(id)}save();st[id]=3;paint(id);const g=document.getElementById('rg');if(g)g.innerHTML=ring()}
function nxt(id){const l=list(),i=l.findIndex(x=>x.id==id),n=l[i+1];(n?document.getElementById('k-'+n.id):document.getElementById('end')).scrollIntoView({behavior:'smooth'})}
function fit(){const f=document.getElementById('feed');if(f)app.style.setProperty('--h',f.clientHeight+'px')}
function go(t,f){v=t;if(f!==undefined)F=f;draw();fit()}
function feed(){const l=list(),n=l.length,dn=Object.keys(S.done).length;
 const menu=`<section class="cd" style="background:var(--cd);color:var(--ink)"><div class="top"><span class="m chip">Browse by shelf</span><span class="m">${dn} / ${D.length} mastered</span></div><div class="bd"><h2 class="ti s">Pick one shelf.</h2><p class="hk" style="font-size:19px">Ideas live under shelves â?? never one long scroll.</p>${SH.map(x=>{const a=D.filter(c=>c.s==x),d=a.filter(c=>S.done[c.id]).length;return `<button class="op" style="border-color:${CL[x][0]}" onclick="go('feed','${x}')"><span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:${CL[x][0]};margin-right:10px"></span><b>${x}</b><span class="m" style="color:var(--mu)"> Â· ${d}/${a.length} mastered â??</span></button>`}).join('')}</div></section>`;return `<div class="toolbar"><div class="in"><button class="fchip ${!F?'on':''}" onclick="go('feed','')">All</button>${SH.map(x=>`<button class="fchip ${F==x?'on':''}" onclick="go('feed','${x}')">${x}</button>`).join('')}<div class="pbar"><i style="width:${dn/D.length*100}%"></i></div><span class="m" style="color:var(--mu)">${dn}/${D.length}</span></div></div><main class="feed" id="feed">${F?'':WEL(D.length)}${F?l.map((c,i)=>sec(c,i,n)).join(''):menu}<section class="cd" id="end" style="background:#0B0B0C;color:#F3F0E8"><div class="bd" style="flex:1;margin-top:0;justify-content:center"><h2 class="ti">That is enough for today.</h2><p class="hk">An endless feed never tells you to stop. We do. Close the app and use one idea today.</p><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="go" style="background:#FCAC04;color:#0B0B0C" onclick="go('explore')">Explore shelves</button><button class="go" style="background:#26262a;color:#F3F0E8" onclick="document.getElementById('feed').scrollTo({top:0,behavior:'smooth'})">Back to top</button></div></div></section></main>`}
function explore(){const t=(x,l)=>{const[bg,fg]=x?CL[x]:['var(--cd)','var(--ink)'],a=D.filter(c=>!x||c.s==x),d=a.filter(c=>S.done[c.id]).length;return `<button class="shelfcard" style="background:${bg};color:${fg}" onclick="go('feed','${x}')"><span class="m">${d} / ${a.length} mastered</span><span><b>${l}</b><span style="display:block;font-size:14px;line-height:1.45;margin-top:8px;opacity:.85">${shelfDesc(x)}</span></span></button>`};
 return `<div class="site"><div class="wrap shelfsec" style="padding-top:40px"><p class="m" style="color:var(--mu)">7 shelves Â· ${D.length} ideas Â· from real books</p><h2>Pick a shelf.</h2><p class="lead">Each shelf is a detox lane. Master one idea at a time â?? one minute, one question.</p><div class="shelfgrid">${t('','All ideas')}${SH.map(x=>t(x,x)).join('')}</div></div></div>`}
function shelfDesc(x){return {Counterintuitive:'Facts that feel wrong. Probability puzzles that rewire gut instinct.',Startups:'MRR, CAC, dilution, SAFEs â?? the terms founders actually use.',Money:'Compounding, margins, safety. The quiet math of money.',Mind:'Anchoring, loss, bias. How your brain tricks you daily.',Habits:'Cues, routines, 2-minute starts. Small loops, big change.',Work:'Deep work, Pareto, Eisenhower. Attention is the asset.',Strategy:'Inversion, second-order thinking. See one move ahead.'}[x]||'Every idea, every shelf. The full detox library.'}
function prog(){const n=Object.keys(S.done).length;return `<div class="site"><div class="wrap" style="padding-top:40px;padding-bottom:80px"><p class="m" style="color:var(--mu)">Detox dashboard</p><h1 style="font-size:clamp(44px,6vw,84px);letter-spacing:-.05em;line-height:.95;margin:6px 0 10px">Your progress.</h1><p class="lead" style="font-size:19px;color:var(--mu);max-width:640px">Brain fog lifts with reps, not marathons. One mastered idea beats an hour of reels.</p><div class="proggrid"><div class="st"><div class="m">Mastered</div><div>${n} / ${D.length}</div><div class="bar"><i style="width:${n/D.length*100}%;background:var(--ink)"></i></div></div><div class="st"><div class="m">Accuracy</div><div>${S.ans?Math.round(S.ok/S.ans*100)+'%':'-'}</div><div class="m" style="color:var(--mu);margin-top:8px">${S.ans} questions answered</div></div></div>${SH.map(x=>{const a=D.filter(c=>c.s==x),d=a.filter(c=>S.done[c.id]).length;return `<div style="margin:16px 0"><div style="display:flex;justify-content:space-between" class="m"><span>${x}</span><span>${d} / ${a.length}</span></div><div class="bar"><i style="width:${d/a.length*100}%;background:${CL[x][0]}"></i></div></div>`}).join('')}<button class="go" style="background:var(--ink);color:var(--bg);margin-top:18px" onclick="if(confirm('Reset all progress?')){S={};try{localStorage.removeItem('bb3')}catch(e){};location.reload()}">Reset progress</button></div></div>`}
function home(){const dn=Object.keys(S.done).length,picks=['deep','monty','loss'].map(id=>D.find(c=>c.id==id)).filter(Boolean);
 return `<div class="site"><div class="wrap"><section class="hero"><span class="eyebrow m">A detox for brain-rot Â· ${D.length} ideas Â· ${dn} mastered</span><h1>Scroll less.<br><em>Learn more.</em></h1><p class="sub">Short ideas from great books â?? probability, money, habits, startups â?? one minute each, one question each. Training data for your brain, not training data for an algorithm.</p><div class="row"><button class="cta" onclick="go('feed')">Start today's detox</button><button class="ghostbtn" onclick="go('explore')">Browse shelves</button></div><div class="stats"><div class="stat"><b>${D.length}</b><span class="m" style="color:var(--mu)">ideas from real books</span></div><div class="stat"><b>7</b><span class="m" style="color:var(--mu)">shelves, zero doomscroll</span></div><div class="stat"><b>1 min</b><span class="m" style="color:var(--mu)">per idea + one quiz</span></div></div></section></div><div class="strip">${(SH.concat(SH)).map(x=>`<span>${x} Â·</span>`).join('')}</div><div class="wrap"><section class="how"><p class="m" style="color:var(--mu)">How the detox works</p><h2>A 3-minute reset,<br>not a 3-hour scroll.</h2><p class="lead">Brain fog comes from passive input. This is active input: read, recall, prove it.</p><div class="steps"><div class="step"><span class="m">01</span><span><b>Read one idea</b><span style="display:block;margin-top:8px;font-size:15px;line-height:1.5;opacity:.85">Distilled from Thinking Fast and Slow, Atomic Habits, Venture Deals and more.</span></span></div><div class="step"><span class="m">02</span><span><b>Answer one question</b><span style="display:block;margin-top:8px;font-size:15px;line-height:1.5;opacity:.85">Recall beats rereading. Every idea ends with a quiz that stamps it mastered.</span></span></div><div class="step"><span class="m">03</span><span><b>Stop. We insist.</b><span style="display:block;margin-top:8px;font-size:15px;line-height:1.5;opacity:.85">No infinite feed. We tell you when enough is enough for today.</span></span></div></div></section><section class="shelfsec"><p class="m" style="color:var(--mu)">Tonight's detox picks</p><h2>Start here.</h2><p class="lead">Three ideas people remember a year later. Tap one to jump into the quiz loop.</p><div class="cards3">${picks.map(c=>{const[bg,fg]=CL[c.s];return `<button class="pick" style="background:${bg};color:${fg}" onclick="go('feed','${c.s}')"><span class="m">${c.s} Â· from ${c.b}</span><span><b>${c.t}</b><span style="display:block;margin-top:10px;font-size:15px;opacity:.85">1 min + 1 question â??</span></span></button>`}).join('')}</div></section><section class="mani"><div><p class="m" style="color:#FCAC04">Our manifesto</p><h2>That is enough for today.</h2><p>An endless feed never tells you to stop. We do. Brain rot is engineered â?? variable rewards, autoplay, outrage. The antidote is small, finished reps: one idea understood beats forty skimmed. Close the app and use one idea today.</p><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:22px"><button class="cta" onclick="go('feed')">Continue detox</button><button class="ghostbtn" style="border-color:#F3F0E8;color:#F3F0E8" onclick="go('prog')">See my progress</button></div></div><div>${art({id:'mani',s:'Mind'})}</div></section><footer class="footer"><b class="lg"><img class="mk" src="${LOGO}" alt="BoringBroLabs logo">boring<span>bros</span></b><span class="m" style="color:var(--mu)">by BoringBroLabs Â· ${D.length} ideas Â· 7 shelves Â· 1 minute each</span></footer></div></div>`}
function draw(){const T=[['home','Home'],['feed','Learn'],['explore','Shelves'],['prog','Progress']];
 app.innerHTML=`<header class="tb"><b class="lg" style="cursor:pointer" onclick="go('home')"><img class="mk" src="${LOGO}" alt="BoringBroLabs logo">boring<span>bros</span></b><nav class="navlinks">${T.map(t=>`<button class="${v==t[0]?'on':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('')}</nav><span style="display:flex;align-items:center;gap:12px"><span class="m" style="color:var(--mu)">${F||'All shelves'}</span><span id="rg">${ring()}</span><span class="m" style="color:var(--mu)" title="build version">v4</span><button class="cta" onclick="go('feed')">Start</button></span></header>${v=='home'?home():v=='feed'?feed():v=='explore'?explore():prog()}<nav class="tab">${T.map(t=>`<button class="${v==t[0]?'on':''}" onclick="go('${t[0]}')">${t[1].toUpperCase()}</button>`).join('')}</nav>`}
draw();fit();addEventListener('resize',fit);if(window.ResizeObserver)new ResizeObserver(fit).observe(app);
